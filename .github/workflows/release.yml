name: release

# Pushing a v* tag builds the zips, attaches them to the GitHub Release, and
# submits the package to both stores for review. Google and Mozilla still
# review by hand, so this removes the dashboard trip, not the wait.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # to attach the zips to the release
    env:
      # At job level, not on the step: a step cannot read the `secrets` context
      # from its own `if`, but it can read `env`.
      CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
      CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
      CWS_ITEM_ID: ${{ secrets.CWS_ITEM_ID }}
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The AMO source archive is `git archive` of the tag, so the tag has
          # to be a real object here, not just the ref that triggered the run.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

      # The tag is public the moment it is pushed. Catching a version mismatch
      # here beats shipping v3.3.0 to the store labelled 3.2.0.
      - name: The tag and the manifest must agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(python3 -c 'import json;print(json.load(open("manifest.json"))["version"])')"
          [ "$tag" = "$manifest" ] || {
            echo "✗ tag $GITHUB_REF_NAME says $tag, manifest.json says $manifest" >&2
            exit 1
          }
          echo "✓ both say $manifest"

      - name: Cache the Stockfish engine
        uses: actions/cache@v4
        with:
          path: |
            stockfish.js
            stockfish.wasm
          key: stockfish-${{ hashFiles('stockfish.sha256') }}
      - name: Fetch the engine if the cache missed
        run: bash scripts/download-stockfish.sh

      - run: npm run package

      # `gh release upload` fails on a tag that has no release yet, and a tag
      # pushed from a terminal has none. Create it from the CHANGELOG section,
      # which also means an undocumented version fails the tag instead of
      # shipping with empty notes.
      - name: Publish the GitHub Release with the zips
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 scripts/release-notes.py "$version" > release-notes.md
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" \
                 --title "$GITHUB_REF_NAME" --notes-file release-notes.md
          gh release upload "$GITHUB_REF_NAME" \
            "stockfish-continue-to-play-chrome-${version}.zip" \
            "stockfish-continue-to-play-firefox-${version}.zip" \
            --clobber

      # Both store steps are skipped, not failed, when their secrets are
      # absent - so a tag still produces a release on a fork, or before the
      # credentials exist. They are separate steps on purpose: one store being
      # unreachable should not hold the other back.
      - name: Submit to the Chrome Web Store
        if: env.CWS_REFRESH_TOKEN != ''
        run: npm run publish:cws -- --publish

      - name: Submit to addons.mozilla.org
        if: env.AMO_JWT_SECRET != ''
        run: npm run publish:amo
